name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # re-verify the public-chain evidence daily

permissions:
  contents: read

jobs:
  contracts:
    name: Solidity — build, 145 tests, fuzz + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vv
        env: { FOUNDRY_PROFILE: ci }

  agent:
    name: Agent — type-check, 60 tests, all four economies on a local chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - run: npm ci
      - run: forge build
      - run: npx tsc -p tsconfig.json
      - run: npm run test:ts
      # The interactive demo's tests exist only on the branch Railway followed for the October demo; on main they are skipped
      - name: npm run test:demo
        if: ${{ hashFiles('agent/test/demo.test.mjs') != '' }}
        run: npm run test:demo
      - name: Interactive browser API-to-contract real Anvil acceptance test
        if: ${{ hashFiles('agent/test/demo.integration.mjs') != '' }}
        run: |
          set -o pipefail
          echo "::notice::$(anvil --version | head -1)"
          npm run test:demo:e2e 2>&1 | tee e2e.log || { grep -E "not ok|rror|assert|expected|actual|did not|failed" e2e.log | head -25 | sed "s/^/::error::/"; exit 1; }
        env: { QED_OFFLINE: "1" }
      - name: Run the whole autonomous economy locally (deterministic offline brain, dev keys)
        run: npm run local
        env: { QED_OFFLINE: "1" }
      - name: Run the certified-clearing economy locally (5 AI businesses, proof-gated netting, dev keys)
        run: npm run local:clearing
      - name: Run the private economy locally (zero-knowledge proof, escrow settlement, theorem bounties)
        run: npm run local:private
      - name: Run the best-execution economy locally (proven routing, 12 refused attacks, front-run, standing policy, policy contract)
        run: npm run local:execute
        env: { QED_OFFLINE: "1" }
      - name: Benchmarks are reproducible (fixed seeds)
        run: npx tsx benchmarks/run.ts > /dev/null && git diff --exit-code benchmarks/results.json

  verify-sepolia:
    name: Independently re-verify every on-chain claim (Ethereum Sepolia, no keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: forge build
      # Every claim is re-derived in full from one public RPC. A single public endpoint can answer "not found" for an
      # old receipt from one of its pruned or lagging nodes (seen twice on 25 Nov 2026 with publicnode, which serves the
      # same receipts at other times), so the whole verification is retried in full against other independent public
      # endpoints. It passes only if one endpoint confirms every claim; nothing is skipped or loosened.
      - name: npm run verify (any one independent public RPC must confirm every claim)
        run: |
          for rpc in https://ethereum-sepolia-rpc.publicnode.com https://sepolia.gateway.tenderly.co https://1rpc.io/sepolia; do
            echo "::group::verify against $rpc"
            if RPC_URL="$rpc" npm run verify; then echo "::endgroup::"; echo "::notice title=verify::every claim confirmed by $rpc"; exit 0; fi
            echo "::endgroup::"; echo "::warning title=verify::$rpc did not confirm every claim; trying the next endpoint"
          done
          echo "::error title=verify::no public endpoint confirmed every claim"; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: evidence/ethereum-sepolia/verification.json
