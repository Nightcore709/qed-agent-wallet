name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # re-verify the public-chain evidence daily

permissions:
  contents: read

jobs:
  contracts:
    name: Solidity — build, 126 tests, fuzz + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vv
        env: { FOUNDRY_PROFILE: ci }

  agent:
    name: Agent — type-check, 56 tests, all four economies on a local chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: forge build
      - run: npx tsc -p tsconfig.json
      - run: npm run test:ts
      - name: Run the whole autonomous economy locally (deterministic offline brain, dev keys)
        run: npm run local
        env: { QED_OFFLINE: "1" }
      - name: Run the certified-clearing economy locally (5 AI businesses, proof-gated netting, dev keys)
        run: npm run local:clearing
      - name: Run the private economy locally (zero-knowledge proof, escrow settlement, theorem bounties)
        run: npm run local:private
      - name: Run the best-execution economy locally (proven routing, 8 refused attacks, front-run)
        run: npm run local:execute
        env: { QED_OFFLINE: "1" }
      - name: Benchmarks are reproducible (fixed seeds)
        run: npx tsx benchmarks/run.ts > /dev/null && git diff --exit-code benchmarks/results.json

  verify-sepolia:
    name: Independently re-verify every on-chain claim (Ethereum Sepolia, no keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: forge build
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: evidence/ethereum-sepolia/verification.json
