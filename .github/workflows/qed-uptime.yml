# QED outside uptime probe: one request to the public /api/ready from GitHub's runners, every 15 minutes. A failing run
# emails the repository's watchers through GitHub's own workflow-failure notification. OPT-IN: it does nothing until the
# owner sets the repository VARIABLE QED_PROBE_URL to the public origin (for example https://qed-demo.up.railway.app).
# Never run on GitHub. It checks reachability and readiness only; it carries no secret and sends nothing but a GET.
# Limits (GitHub docs, read 24 Nov 2026): scheduled runs can be delayed under load, run only on the default branch, and in a
# public repository are disabled after 60 days without repository activity. It is a free second opinion, not an on-call
# service: apps/qed-demo/docs/DEPLOY.md, "Monitoring", lists real monitors as the owner's choice.
name: qed-uptime
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: qed-uptime
  cancel-in-progress: true
jobs:
  probe:
    if: ${{ vars.QED_PROBE_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: /api/ready answers 200 with ready true, over https, with a certificate that is not near expiry
        env:
          BASE: ${{ vars.QED_PROBE_URL }}
        run: |
          set -euo pipefail
          case "$BASE" in https://*) ;; *) echo "QED_PROBE_URL must start with https://"; exit 2 ;; esac
          BASE="${BASE%/}"
          body=$(curl --silent --show-error --fail --max-time 20 --retry 2 --retry-delay 5 "$BASE/api/ready")
          echo "$body" | grep -q '"ready":true' || { echo "not ready: $body"; exit 1; }
          host=${BASE#https://}; host=${host%%/*}
          end=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "certificate expires in $days days"
          [ "$days" -ge 14 ] || { echo "certificate under 14 days"; exit 1; }
          curl --silent --show-error --head --max-time 20 "$BASE/" | grep -qi '^strict-transport-security:' || { echo "no HSTS header"; exit 1; }
